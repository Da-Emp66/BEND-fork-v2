[project]
name = "bend-fork"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.14.2",
    "biopython>=1.81",
    "einops>=0.8.1",
    "h5py>=3.15.1",
    "hydra-core>=1.3.1",
    "hydra-joblib-launcher>=1.2.0",
    "lxml>=6.0.2",
    "pandas>=2.0.2",
    "pysam>=0.23.3",
    "scikit-learn>=1.2.2",
    "torch>=2.0.1",
    "torchvision>=0.24.0",
    "tqdm>=4.65.0",
    "transformers>=4.33.3",
    "wandb==0.13.5",
    "webdataset>=1.0.2",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools]
packages = ["bend"]
